services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_payment_account
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      interval: 2s
      retries: 30
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d agent_payment_account
      timeout: 5s
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
