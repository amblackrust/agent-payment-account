services:
  # Development-only PostgreSQL. Do not expose this compose service publicly.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_payment_account
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d agent_payment_account
      timeout: 5s
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
